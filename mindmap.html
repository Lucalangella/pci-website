            })(() => window.markmap,null,{"content":"Principi Contabili Internazionali &#x2013; Prova Intercorso (12 Moduli Completi)","children":[{"content":"1. Conceptual Framework (2018) &amp; Capital Maintenance","children":[{"content":"<strong>Natura, Funzione e Gerarchia delle Fonti (IAS 8)</strong>","children":[{"content":"<strong>Cos&apos;&#xe8; il Conceptual Framework?</strong>","children":[{"content":"&#xc8; il documento teorico fondativo dello IASB (aggiornato nel 2018, strutturato in 8 capitoli) che fissa i concetti, gli obiettivi e i principi cardine del <em>General Purpose Financial Reporting</em>.","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"<strong>Status Giuridico Formale</strong>: NON &#xe8; un principio contabile (IFRS o IAS) e NON ha forza cogente diretta. Di conseguenza, <strong>non prevale mai su alcun principio contabile specifico</strong>: in caso di contrasto tra il Framework e uno standard (es. IAS 38 o IFRS 9), prevale sempre lo standard specifico.","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"li","lines":"11,14"}},{"content":"<strong>Le 3 Funzioni Chiave e la Gerarchia di IAS 8</strong>:","children":[{"content":"1. Guida lo standard setter (<strong>IASB</strong>) nello sviluppo coerente di nuovi principi contabili;","children":[],"payload":{"tag":"li","lines":"15,16","listIndex":1}},{"content":"2. Assiste revisori contabili (<em>auditors</em>), analisti e autorit&#xe0; di vigilanza nell&apos;interpretazione del bilancio;","children":[],"payload":{"tag":"li","lines":"16,17","listIndex":2}},{"content":"3. <strong>Vincolo per i Redattori (<em>Preparers</em>) ex IAS 8</strong>: quando una transazione non &#xe8; disciplinata da uno specifico IFRS (come avvenuto per le criptovalute nel 2019), il management deve applicare la gerarchia dello IAS 8: consultare prima gli IFRS che regolano fattispecie analoghe e, subito dopo, le definizioni e i concetti del Conceptual Framework.","children":[],"payload":{"tag":"li","lines":"17,18","listIndex":3}}],"payload":{"tag":"li","lines":"14,18"}}],"payload":{"tag":"li","lines":"10,18"}},{"content":"<strong>Obiettivo del Bilancio e Destinatari Primari (<em>Primary Users</em>)</strong>","children":[{"content":"<strong>Utilit&#xe0; Decisionale (<em>Decision-Usefulness</em>)</strong>: Fornire informazioni economico-finanziarie utili ai fornitori di capitale di rischio e di debito per assumere decisioni sull&apos;erogazione di risorse all&apos;entit&#xe0;.","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"<strong>Chi sono i Primary Users?</strong>: Esclusivamente <strong>investitori</strong> (azionisti attuali e potenziali), <strong>finanziatori</strong> (<em>lenders</em>) e <strong>altri creditori</strong> (obbligazionisti, fornitori). Non hanno il potere contrattuale di esigere report su misura (a differenza di Fisco o management) e dipendono dal bilancio pubblico per stimare ammontare, tempistica e incertezza dei <strong>flussi di cassa futuri netti</strong> (<em>cash flow prospects</em>) e valutare la <em>stewardship</em> del management.","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"<strong>Entity Perspective &amp; Going Concern</strong>:","children":[{"content":"<em>Entity Perspective</em>: Il bilancio rappresenta l&apos;entit&#xe0; come soggetto economico autonomo e distinto dai suoi soci;","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"<em>Going Concern (Continuit&#xe0; Aziendale)</em>: Presuppone che l&apos;azienda operi nel futuro prevedibile (almeno 12 mesi); altrimenti si adottano criteri di liquidazione.","children":[],"payload":{"tag":"li","lines":"23,24"}}],"payload":{"tag":"li","lines":"21,24"}}],"payload":{"tag":"li","lines":"18,24"}},{"content":"<strong>Reporting Entity vs Legal Entity (I 4 Casi Operativi)</strong>","children":[{"content":"La contabilit&#xe0; IFRS applica il principio della <strong>sostanza economica sulla forma giuridica (<em>substance over form</em>)</strong>: il perimetro economico del bilancio (<em>Reporting Entity</em>) non coincide necessariamente con il perimetro legale della singola societ&#xe0; (<em>Legal Entity</em>).","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<strong>1. Reporting Entity &gt; Legal Entity <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Bilancio Consolidato</strong>: Capogruppo + controllate; abbatte i confini legali elidendo le partite infragruppo e sommando attivit&#xe0;, passivit&#xe0;, ricavi e costi come un&apos;unica impresa;","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<strong>2. Reporting Entity &lt; Legal Entity <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Segment Reporting / Carve-out</strong>: Un singolo ramo d&apos;azienda o divisione interna a una persona giuridica;","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"<strong>3. Societ&#xe0; sotto Controllo Comune <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Bilancio Combinato (<em>Combined</em>)</strong>: Societ&#xe0; &quot;sorelle&quot; controllate dalla stessa persona fisica o famiglia senza una holding capogruppo al vertice;","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"<strong>4. Bilancio Non Consolidato (Separato della Sola Madre)</strong>: Coincide con la sola capogruppo; le figlie non vengono consolidate riga per riga ma iscritte nella voce <em>&quot;Partecipazioni in controllate&quot;</em> ex IAS 27 (al costo, al Fair Value IFRS 9 o a Patrimonio Netto).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>Divieto di Cherry-Picking</strong>: I confini della reporting entity non possono essere tracciati ad arte per escludere debiti o rami in perdita.","children":[],"payload":{"tag":"li","lines":"30,31"}}],"payload":{"tag":"li","lines":"24,31"}},{"content":"<strong>Caratteristiche Qualitative Fondamentali (<em>Fundamental</em>)</strong>","children":[{"content":"<strong>1. Significativit&#xe0; (<em>Relevance</em>) e Rilevanza (<em>Materiality</em>)</strong>:","children":[{"content":"Un&apos;informazione &#xe8; significativa se ha <strong>valore predittivo</strong> e/o <strong>valore confermativo</strong>.","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"<strong>Materiality (Rilevanza)</strong>: L&apos;informazione &#xe8; rilevante se la sua omissione, errata indicazione o oscuramento (<em>obscuring</em>) pu&#xf2; influenzare le decisioni dei primary users.","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"<strong>Soglia Quantitativa</strong>: Scostamento o errore <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2265;</mo><mrow><mn mathvariant=\"bold\">5</mn><mi mathvariant=\"bold\">%</mi></mrow></mrow><annotation encoding=\"application/x-tex\">\\ge \\mathbf{5\\%}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7719em;vertical-align:-0.136em;\"></span><span class=\"mrel\">&#x2265;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8056em;vertical-align:-0.0556em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">5%</span></span></span></span></span> nella stima dell&apos;utile d&apos;esercizio;","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<strong>Soglia Qualitativa (anche per importi minimi)</strong>: 1) Inversione del segno (da utile a perdita); 2) Violazione di <em>covenants</em> bancari; 3) Operazioni con parti correlate o compensi del management.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<strong>Processo in 4 Fasi (Practice Statement 2)</strong>: <em>1. Identify</em> <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <em>2. Assess</em> (filtro quantitativo + qualitativo) <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <em>3. Organise</em> (anti-oscuramento) <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <em>4. Review</em>.","children":[],"payload":{"tag":"li","lines":"37,38"}}],"payload":{"tag":"li","lines":"32,38"}},{"content":"<strong>2. Rappresentazione Fedele (<em>Faithful Representation</em>)</strong>:","children":[{"content":"Richiede <strong>Completezza</strong>, <strong>Assenza di errori</strong> (processo di stima rigoroso e trasparente) e <strong>Neutralit&#xe0;</strong> (assenza di distorsioni per orientare il giudizio).","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"<strong>Prudenza Cautelativa vs Prudenza Asimmetrica Civilistica</strong>: Lo IASB accoglie la <em>Cautious Prudence</em> (cautela nelle stime in condizioni di incertezza), ma <strong>VIETA categoricamente la prudenza asimmetrica e le riserve occulte</strong>: sottostimare un attivo o gonfiare i costi oggi deprime l&apos;utile corrente ma gonfia artificialmente gli utili degli esercizi futuri, violando la neutralit&#xe0;.","children":[],"payload":{"tag":"li","lines":"40,41"}}],"payload":{"tag":"li","lines":"38,41"}}],"payload":{"tag":"li","lines":"31,41"}},{"content":"<strong>Caratteristiche di Potenziamento (<em>Enhancing</em>) e Vincolo del Costo</strong>","children":[{"content":"<strong>Comparabilit&#xe0;</strong> (nel tempo e nello spazio), <strong>Verificabilit&#xe0;</strong> (diretta o indiretta sui modelli di stima), <strong>Tempestivit&#xe0;</strong> e <strong>Comprensibilit&#xe0;</strong>, soggette al <strong>Vincolo del Costo</strong> (i benefici informativi devono superare i costi di produzione del dato).","children":[],"payload":{"tag":"li","lines":"42,43"}}],"payload":{"tag":"li","lines":"41,43"}},{"content":"<strong>Elementi del Bilancio e Criteri di Misurazione</strong>","children":[{"content":"<strong>Attivit&#xe0; (<em>Asset</em>)</strong>: Risorsa economica presente controllata dall&apos;entit&#xe0; per eventi passati; &#xe8; un <strong>diritto</strong> che ha il <strong>potenziale di produrre benefici economici</strong> (non serve pi&#xf9; la certezza/probabilit&#xe0; elevata nella definizione base).","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"<strong>Passivit&#xe0; (<em>Liability</em>)</strong>: Obbligazione attuale al trasferimento di una risorsa economica per la quale l&apos;entit&#xe0; <strong>non ha la capacit&#xe0; pratica di evitare il trasferimento</strong>.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"<strong>Basi di Misurazione</strong>: <strong>Costo Storico</strong> vs <strong>Valori Correnti</strong> (<em>Fair Value</em> IFRS 13 market-based, <em>Value in Use</em> IAS 36 entity-specific, <em>Current Cost</em> costo di sostituzione).","children":[],"payload":{"tag":"li","lines":"46,47"}}],"payload":{"tag":"li","lines":"43,47"}},{"content":"<strong>Mantenimento del Capitale (<em>Capital Maintenance</em> &#x2013; Modulo 05)</strong>","children":[{"content":"<strong>Regola Aurea (Quesito 05.1)</strong>: C&apos;&#xe8; profitto solo dopo aver mantenuto intatto il capitale iniziale. Gli apporti dei soci e i dividendi sono operazioni con i proprietari e <strong>vanno sempre esclusi dal calcolo del profitto</strong>.","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"<strong>Formula d&apos;Esame ed Esercizio Risolto (Quesito 05.3)</strong>:","children":[{"content":"\n<p class=\"katex-block\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mtext>Profitto</mtext><mo>=</mo><mo stretchy=\"false\">(</mo><msub><mtext>PN</mtext><mtext>finale</mtext></msub><mo>&#x2212;</mo><msub><mtext>PN</mtext><mtext>iniziale</mtext></ms =\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">15.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">&#x2192;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord text\"><span class=\"mord\">Profitto</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">35.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">40.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">15.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">10.000</span></span></span></span></span> &#x20ac;.","children":[],"payload":{"tag":"li","lines":"51,52"}}],"payload":{"tag":"li","lines":"49,52"}},{"content":"<strong>Confronto tra i 3 Modelli di Capitale (Quesito 05.2)</strong>:","children":[{"content":"1. <strong>Capitale Finanziario Nominale</strong>: conserva l&apos;importo monetario iniziale investito (ignora l&apos;inflazione);","children":[],"payload":{"tag":"li","lines":"53,54","listIndex":1}},{"content":"2. <strong>Capitale Finanziario Reale</strong>: conserva il potere d&apos;acquisto reale iniziale (rettificato con indice generale dei prezzi ex IAS 29);","children":[],"payload":{"tag":"li","lines":"54,55","listIndex":2}},{"content":"3. <strong>Capitale Fisico</strong>: conserva la <strong>capacit&#xe0; produttiva operativa fisica</strong> (valutazione a costi correnti di sostituzione; i rincari dei beni strumentali non sono utile distribuibile ma vanno a riserva di patrimonio netto).","children":[],"payload":{"tag":"li","lines":"55,57","listIndex":3}}],"payload":{"tag":"li","lines":"52,57"}}],"payload":{"tag":"li","lines":"47,57"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"2. IAS 1 &#x2013; Presentazione del Bilancio","children":[{"content":"<strong>Ambito di Vigenza Temporale e Set Completo (Quesito 01.1)</strong>","children":[{"content":"<strong>Vigenza (Quesito 01.1)</strong>: Per il bilancio 2026 (senza adozione anticipata di IFRS 18) si applica obbligatoriamente <strong>IAS 1</strong>, poich&#xe9; l&apos;IFRS 18 diventa obbligatorio solo per gli esercizi che iniziano dal <strong>1&#xb0; gennaio 2027</strong>.","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"<strong>I 5+1 Documenti Obbligatori</strong>: 1) Stato Patrimoniale; 2) Prospetto dell&apos;Utile/Perdita (P&amp;L) e delle Altre Componenti di Conto Economico Complessivo (OCI); 3) Prospetto Variazioni del Patrimonio Netto; 4) Rendiconto Finanziario (IAS 7); 5) Note al Bilancio; 6) Terzo SP all&apos;inizio del periodo comparativo in caso di <em>restatement</em> retrospettivo ex IAS 8.","children":[],"payload":{"tag":"li","lines":"60,61"}}],"payload":{"tag":"li","lines":"58,61"}},{"content":"<strong>Postulati Generali di Redazione</strong>","children":[{"content":"<strong>Competenza Economica (<em>Accrual Basis</em>)</strong>: Rilevazione quando i fatti maturano economicamente (vale per tutto il bilancio tranne il Rendiconto Finanziario IAS 7).","children":[],"payload":{"tag":"li","lines":"62,63"}},{"content":"<strong>Divieto di Compensazione (<em>No Offsetting</em>)</strong>: Vietato compensare partite attive e passive o costi e ricavi salvo obbligo/permesso di uno specifico IFRS.","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"<strong>Divieto di Componenti Straordinari</strong>: Abolita qualsiasi voce &quot;straordinaria&quot; nel P&amp;L e nelle Note.","children":[],"payload":{"tag":"li","lines":"64,65"}}],"payload":{"tag":"li","lines":"61,65"}},{"content":"<strong>Stato Patrimoniale: Distinzione Corrente vs Non Corrente</strong>","children":[{"content":"<strong>Attivit&#xe0; Correnti</strong>: 1) Realizzo/consumo nel <strong>normale ciclo operativo</strong> (anche se dura <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&gt;</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">&gt; 12</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.5782em;vertical-align:-0.0391em;\"></span><span class=\"mrel\">&gt;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">12</span></span></span></span> mesi, es. cantieri navali, stagionatura formaggi/vini); 2) Detenute per <em>trading</em>; 3) Realizzo entro <strong>12 mesi</strong>; 4) Disponibilit&#xe0; liquide non vincolate.","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"<strong>Il Trabocchetto del Rifinanziamento Post-Chiusura (Quesito 01.2)</strong>:","children":[{"content":"Un debito che al 31 dicembre scade a 9 mesi e viene rifinanziato a lungo termine solo a febbraio (prima dell&apos;approvazione del bilancio) <strong>RESTA PASSIVIT&#xc0; CORRENTE al 31 dicembre</strong>, perch&#xe9; alla data di chiusura mancava il diritto incondizionato a differire il rimborso di almeno 12 mesi (evento <em>non-adjusting</em> ex IAS 10 da indicare solo nelle Note).","children":[],"payload":{"tag":"li","lines":"68,69"}}],"payload":{"tag":"li","lines":"67,69"}},{"content":"<strong>Current Ratio</strong>: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mtext>Attivit</mtext><mover accent=\"true\"><mtext>a</mtext><mo>&#x2cb;</mo></mover><mtext>&#xa0;Correnti</mtext></mrow><mi mathvariant=\"normal\">/</mi><mrow><mtext>Passivit</mtext><mover accent=\"true\"><mtext>a</mtext><mo>&#x2cb;</mo></mover><mtext>&#xa0;Correnti</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\\text{Attivit&#xe0; Correnti} / \\text{Passivit&#xe0; Correnti}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord text\"><span class=\"mord\">Attivit</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">a</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">&#x2cb;</span></span></span></span></span></span></span><span class=\"mord\">&#xa0;Correnti</span></span><span class=\"mord\">/</span><span class=\"mord text\"><span class=\"mord\">Passivit</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">a</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">&#x2cb;</span></span></span></span></span></span></span><span class=\"mord\">&#xa0;Correnti</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"69,70"}}],"payload":{"tag":"li","lines":"65,70"}},{"content":"<strong>Total Comprehensive Income (TCI), OCI e Regola del Recycling</strong>","children":[{"content":"\n<p class=\"katex-block\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mtext>Total&#xa0;Comprehensive&#xa0;Income&#xa0;(TCI)</mtext><mo>=</mo><mtext>Profit&#xa0;or&#xa0;Loss&#xa0;(P&amp;L)</mtext><mo>+</mo><mtext>Other&#xa0;Comprehensive&#xa0;Income&#xa0;(OCI)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{Total Comprehensive Income (TCI)} = \\text{Profit or Loss (P\\&amp;L)} + \\text{Other Comprehensive Income (OCI)}\n</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord text\"><span class=\"mord\">Total&#xa0;Comprehensive&#xa0;Income&#xa0;(TCI)</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord text\"><span class=\"mord\">Profit&#xa0;or&#xa0;Loss&#xa0;(P&amp;L)</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord text\"><span class=\"mord\">Other&#xa0;Comprehensive&#xa0;Income&#xa0;(OCI)</span></span></span></span></span></span></p>","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"<strong>Effetto Rivalutazione Immobili (Quesito 01.3)</strong>: Un incremento da rivalutazione rilevato in OCI <strong>aumenta il Risultato Complessivo (TCI) e il Patrimonio Netto, senza aumentare l&apos;Utile d&apos;Esercizio (P&amp;L)</strong>.","children":[],"payload":{"tag":"li","lines":"72,73"}},{"content":"<strong>La Regola del Recycling (Riclassificazione da OCI a P&amp;L)</strong>:","children":[{"content":"<strong>Voci CON Recycling a P&amp;L</strong>: Titoli di debito FVOCI (IFRS 9), riserve <em>Cash Flow Hedge</em>, differenze cambio da traduzione di bilanci esteri (IAS 21). Al momento del realizzo/vendita transitano a P&amp;L;","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"<strong>Voci SENZA Recycling (MAI a P&amp;L)</strong>: <strong>Riserva di rivalutazione su immobilizzazioni materiali e immateriali (IAS 16 e IAS 38)</strong>, strumenti rappresentativi di capitale (azioni) designati a FVOCI (IFRS 9), utili/perdite attuariali su benefici definiti ai dipendenti (IAS 19). Alla vendita del bene rivalutato, la riserva OCI residua viene girata direttamente a <em>Utili portati a nuovo</em> (<em>Retained Earnings</em>) per impedire manipolazioni dell&apos;utile (<em>cherry-picking</em>).","children":[],"payload":{"tag":"li","lines":"75,76"}}],"payload":{"tag":"li","lines":"73,76"}}],"payload":{"tag":"li","lines":"70,76"}},{"content":"<strong>Classificazione dei Costi Operativi a Conto Economico</strong>","children":[{"content":"<strong>Per Natura</strong> (materie prime, personale, ammortamenti) oppure <strong>Per Destinazione / Funzione</strong> (Costo del venduto, costi commerciali, costi amministrativi).","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"<strong>Obbligo in Nota</strong>: Chi sceglie la classificazione per destinazione deve obbligatoriamente indicare nelle Note l&apos;ammontare per natura di <strong>ammortamenti</strong> e <strong>costi del personale</strong>.","children":[],"payload":{"tag":"li","lines":"78,80"}}],"payload":{"tag":"li","lines":"76,80"}}],"payload":{"tag":"h2","lines":"57,58"}},{"content":"3. IFRS 18 &#x2013; Nuova Presentazione e Disclosure (In vigore dal 2027)","children":[{"content":"<strong>Perch&#xe9; l&apos;IFRS 18 Sostituisce lo IAS 1 dal 1&#xb0; Gennaio 2027</strong>","children":[{"content":"Nello IAS 1 mancavano definizioni vincolanti dei subtotali intermedi (ogni impresa calcolava l&apos;EBIT in modo diverso) e proliferavano metriche <em>non-GAAP</em> non verificate. L&apos;IFRS 18 introduce una struttura rigida di Conto Economico e porta i KPI del management dentro le Note sottoposte a revisione.","children":[],"payload":{"tag":"li","lines":"82,83"}}],"payload":{"tag":"li","lines":"81,83"}},{"content":"<strong>Le 3 Nuove Categorie Obbligatorie del Conto Economico</strong>","children":[{"content":"<strong>1. Categoria Operativa (<em>Operating Category</em> &#x2013; Categoria Residuale)</strong>:","children":[{"content":"Include tutti i proventi e oneri dell&apos;attivit&#xe0; principale dell&apos;impresa pi&#xf9; <strong>qualsiasi voce che non rientri nelle altre categorie</strong> (categoria residuale di default, inclusi oneri di ristrutturazione o svalutazioni operative).","children":[],"payload":{"tag":"li","lines":"85,86"}}],"payload":{"tag":"li","lines":"84,86"}},{"content":"<strong>2. Categoria di Investimento (<em>Investing Category</em>)</strong>:","children":[{"content":"Include i rendimenti di attivit&#xe0; che generano flussi <strong>in modo autonomo e indipendente</strong> dalle risorse operative aziendali: proventi da investimenti immobiliari (IAS 40), dividendi e interessi attivi su titoli finanziari, quote di utili/perdite di collegate e Joint Venture valutate al patrimonio netto (IAS 28).","children":[],"payload":{"tag":"li","lines":"87,88"}}],"payload":{"tag":"li","lines":"86,88"}},{"content":"<strong>3. Categoria di Finanziamento (<em>Financing Category</em>)</strong>:","children":[{"content":"Include gli oneri e proventi su passivit&#xe0; volte alla <strong>raccolta di finanziamenti</strong> (interessi su mutui, obbligazioni, debiti di leasing IFRS 16) e l&apos;<em>unwinding</em> dello sconto su fondi passivi (IAS 37 / IAS 19).","children":[],"payload":{"tag":"li","lines":"89,90"}}],"payload":{"tag":"li","lines":"88,90"}}],"payload":{"tag":"li","lines":"83,90"}},{"content":"<strong>I 2 Subtotali Obbligatori e la Confrontabilit&#xe0; degli EBITDA (Quesito 01.4)</strong>","children":[{"content":"1. <strong>Risultato Operativo (<em>Operating Profit</em>)</strong>;","children":[],"payload":{"tag":"li","lines":"91,92","listIndex":1}},{"content":"2. <strong>Risultato prima dei finanziamenti e delle imposte sul reddito (<em>Profit or loss before financing and income taxes</em>)</strong>.","children":[],"payload":{"tag":"li","lines":"92,93","listIndex":2}},{"content":"<strong>Funzione nel Confronto tra Imprese (Quesito 01.4)</strong>: Quando due societ&#xe0; pubblicano <em>EBITDA rettificati</em> con esclusioni differenti, i subtotali IFRS 18 <strong>offrono riferimenti comuni e standardizzati</strong> per ancorare l&apos;analisi finanziaria.","children":[],"payload":{"tag":"li","lines":"93,94"}}],"payload":{"tag":"li","lines":"90,94"}},{"content":"<strong>Disciplina delle MPMs (<em>Management-defined Performance Measures</em>)</strong>","children":[{"content":"I subtotali alternativi di ricavi e costi comunicati pubblicamente dal management (es. <em>Adjusted Operating Profit</em>, <em>Adjusted EBITDA</em>) devono essere illustrati in una <strong>singola Nota dedicata del bilancio</strong> soggetta ad <strong>Audit</strong>, corredata da una <strong>tabella di riconciliazione analitica</strong> con il subtotale IFRS 18 pi&#xf9; direttamente comparabile, indicando l&apos;effetto fiscale e la quota di terzi (<em>NCI</em>).","children":[],"payload":{"tag":"li","lines":"95,96"}}],"payload":{"tag":"li","lines":"94,96"}},{"content":"<strong>Principi di Aggregazione, Disaggregazione e Anti-Oscuramento</strong>","children":[{"content":"Divieto di nascondere componenti anomale o rilevanti dentro voci generiche come <em>&quot;Altri costi operativi&quot;</em>.","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"li","lines":"96,99"}}],"payload":{"tag":"h2","lines":"80,81"}},{"content":"4. IAS 7 &#x2013; Rendiconto Finanziario (&quot;Cash is King&quot;)","children":[{"content":"<strong>Principio di Cassa (<em>Cash Basis</em>) e Perimetro della Liquidit&#xe0;</strong>","children":[{"content":"Unico prospetto di bilancio redatto per <strong>cassa</strong> anzich&#xe9; per competenza economica.","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"<strong>Cash &amp; Cash Equivalents</strong>: Cassa contante, depositi bancari a vista e investimenti finanziari a brevissimo termine (scadenza originaria <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2264;</mo><mrow><mn mathvariant=\"bold\">3</mn><mtext>&#xa0;mesi</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\\le \\mathbf{3\\text{ mesi}}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7719em;vertical-align:-0.136em;\"></span><span class=\"mrel\">&#x2264;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6679em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">3</span><span class=\"mord text\"><span class=\"mord\">&#xa0;mesi</span></span></span></span></span></span>), prontamente convertibili in un ammontare noto di denaro e soggetti a un <strong>rischio trascurabile di variazione del valore</strong> (escluse azioni e criptovalute!).","children":[],"payload":{"tag":"li","lines":"102,103"}}],"payload":{"tag":"li","lines":"100,103"}},{"content":"<strong>Le 3 Macro-Aree dei Flussi Finanziari</strong>","children":[{"content":"<strong>1. Attivit&#xe0; Operativa (<em>Operating</em>)</strong>: Incassi da clienti e pagamenti a fornitori, dipendenti e imposte;","children":[],"payload":{"tag":"li","lines":"104,105"}},{"content":"<strong>2. Attivit&#xe0; di Investimento (<em>Investing</em> &#x2013; Quesito 02.3)</strong>: Esborsi per acquisto (<em>CapEx</em>) e incassi per cessione di immobilizzazioni materiali, immateriali e finanziarie.","children":[{"content":"<em>Esercizio Risolto (Quesito 02.3)</em>: Pagati &#x20ac;50.000 per un nuovo impianto, incassati &#x20ac;8.000 dalla vendita di un vecchio macchinario e ricevuti &#x20ac;30.000 da un nuovo prestito bancario <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Il prestito (&#x20ac;30.000) va nel <em>Finanziamento</em>; il <strong>Flusso Netto di Investimento</strong> &#xe8; pari a <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2212;</mo><mn>50.000</mn><mo>+</mo><mn>8.000</mn><mo>=</mo><mrow><mo>&#x2212;</mo><mn mathvariant=\"bold\">42.000</mn></mrow></mrow><annotation encoding=\"application/x-tex\">-50.000 + 8.000 = \\mathbf{-42.000}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mord\">50.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">8.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\"><span class=\"mord\">&#x2212;</span><span class=\"mord mathbf\">42.000</span></span></span></span></span> &#x20ac;!","children":[],"payload":{"tag":"li","lines":"106,107"}}],"payload":{"tag":"li","lines":"105,107"}},{"content":"<strong>3. Attivit&#xe0; di Finanziamento (<em>Financing</em>)</strong>: Aumenti di capitale a pagamento, dividendi pagati, accensione e rimborso di prestiti/mutui e <strong>rimborso della quota capitale dei debiti di leasing ex IFRS 16</strong>.","children":[],"payload":{"tag":"li","lines":"107,108"}}],"payload":{"tag":"li","lines":"103,108"}},{"content":"<strong>Metodo Diretto vs Metodo Indiretto e Dinamica del Capitale Circolante Netto (Quesiti 02.2 &amp; 02.4)</strong>","children":[{"content":"Nel <strong>Metodo Indiretto</strong>, il Flusso Operativo si ottiene rettificando l&apos;Utile d&apos;Esercizio:<p class=\"katex-block\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mtext>Flusso&#xa0;Operativo</mtext><mo>=</mo><mtext>Utile</mtext><mo>+</mo><mtext>Costi&#xa0;non&#xa0;monetari&#xa0;(Ammortamenti,&#xa0;Svalutazioni)</mtext><mo>&#x2212;</mo><mtext>Plusvalenze&#xa0;da&#xa0;cessione</mtext><mo>&#x2212;</mo><mi mathvariant=\"normal\">&#x394;</mi><mtext>Crediti&#xa0;Comm.</mtext><mo>&#x2212;</mo><mi mathvarian ign:-0.0833em;\"></span><span class=\"mord\">&#x394;</span><span class=\"mord text\"><span class=\"mord\">Crediti&#xa0;Comm.</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord\">&#x394;</span><span class=\"mord text\"><span class=\"mord\">Rimanenze</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord\">&#x394;</span><span class=\"mord text\"><span class=\"mord\">Debiti&#xa0;Comm.</span></span></span></span></span></span></p>","children":[],"payload":{"tag":"li","lines":"109,111"}},{"content":"<strong>Perch&#xe9; si sottrae la Plusvalenza da cessione?</strong>: Perch&#xe9; non &#xe8; un flusso operativo e l&apos;intero prezzo incassato dalla vendita del cespite &#xe8; gi&#xe0; contabilizzato nell&apos;<em>Attivit&#xe0; di Investimento</em>.","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"<strong>Vendite a Credito non Incassate (Quesito 02.4)</strong>: Le vendite a dilazione fanno crescere i ricavi e l&apos;Utile a Conto Economico, ma finch&#xe9; il cliente non paga <strong>l&apos;aumento dei crediti commerciali assorbe liquidit&#xe0; e riduce il flusso operativo rispetto all&apos;utile</strong>.","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"<strong>Esercizio Numerico Risolto (Quesito 02.2)</strong>:","children":[{"content":"<em>Dati</em>: Utile <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>85.000</mn></mrow><annotation encoding=\"application/x-tex\">= 85.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">85.000</span></span></span></span> &#x20ac;; Ammortamenti <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>+</mo><mn>20.000</mn></mrow><annotation encoding=\"application/x-tex\">= +20.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">+</span><span class=\"mord\">20.000</span></span></span></span> &#x20ac;; Plusvalenza da cessione <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>&#x2212;</mo><mn>5.000</mn></mrow><annotation encoding=\"application/x-tex\">= -5.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mord\">5.000</span></span></span></span> &#x20ac;; Aumento crediti <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>&#x2212;</mo><mn>15.000</mn></mrow><annotation encoding=\"application/x-tex\">= -15.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mord\">15.000</span></span></span></span> &#x20ac;; Aumento rimanenze <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>&#x2212;</mo><mn>8.000</mn></mrow><annotation encoding=\"application/x-tex\">= -8.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mord\">8.000</span></span></span></span> &#x20ac;; Aumento debiti verso fornitori <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>+</mo><mn>10.000</mn></mrow><annotation encoding=\"application/x-tex\">= +10.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">+</span><span class=\"mord\">10.000</span></span></span></span> &#x20ac;.","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"\n<p class=\"katex-block katex-error\" tit bilit&#xe0; (<em>sensitivity analysis</em>)</strong> a variazioni ragionevolmente possibili dei parametri.","children":[],"payload":{"tag":"li","lines":"123,124"}},{"content":"<strong>Divieto di Sanatoria in Nota (Quesito 03.3)</strong>: Se l&apos;azienda opera nei prospetti una compensazione (<em>offsetting</em>) vietata tra attivit&#xe0; e passivit&#xe0;, <strong>l&apos;indicazione degli importi lordi nelle Note NON sana l&apos;errore commesso nei prospetti primari</strong>.","children":[],"payload":{"tag":"li","lines":"124,125"}}],"payload":{"tag":"li","lines":"121,125"}},{"content":"<strong>Management Commentary (IFRS Practice Statement 1 &#x2013; Modulo 04)</strong>","children":[{"content":"Relazione narrativa che correda il bilancio offrendo la lettura gestionale <em>&quot;through the eyes of management&quot;</em>.","children":[],"payload":{"tag":"li","lines":"126,127"}},{"content":"<strong>Qualit&#xe0; degli Utili e Componenti Non Ricorrenti (Quesito 04.1)</strong>: Se l&apos;utile totale cresce grazie alla vendita isolata di un immobile mentre i margini delle vendite ordinarie calano, il commento deve <strong>distinguere nettamente il contributo occasionale della cessione dall&apos;andamento dei margini operativi</strong>, spiegandone cause e prospettive.","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"<strong>Perdita di Clienti e Concentrazione dei Rischi (Quesito 04.2)</strong>: Il calo dei ricavi per la perdita di un cliente chiave va analizzato <strong>collegandolo al grado di concentrazione della clientela, alle azioni correttive avviate e ai rischi residui</strong>.","children":[],"payload":{"tag":"li","lines":"128,129"}},{"content":"<strong>Informazioni Prospettiche (<em>Forward-Looking Information</em> &#x2013; Quesito 04.3)</strong>: Una previsione di ripresa subordinata a nuovi contratti &#xe8; utile agli investitori solo se <strong>esplicita le ipotesi sottostanti, le evidenze disponibili e i fattori di incertezza</strong> che possono modificare l&apos;esito.","children":[],"payload":{"tag":"li","lines":"129,130"}}],"payload":{"tag":"li","lines":"125,130"}},{"content":"<strong>Sustainability Reporting: ISSB (IFRS S1 &amp; S2) vs CSRD Europea</strong>","children":[{"content":"<strong>Nascita dell&apos;ISSB (COP26, 2021)</strong>: Affianca lo IASB dentro la IFRS Foundation per creare una <em>Global Baseline</em> di informativa ESG per i mercati finanziari, strutturata sui 4 pilastri TCFD (<em>Governance, Strategy, Risk Management, Metrics &amp; Targets</em>):","children":[{"content":"<strong>IFRS S1</strong>: Requisiti generali per l&apos;informativa finanziaria connessa alla sostenibilit&#xe0;;","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"<strong>IFRS S2</strong>: Informativa specifica sul <strong>Clima</strong> (rischi fisici, rischi di transizione ed emissioni GHG <em>Scope 1, Scope 2 e Scope 3</em>).","children":[],"payload":{"tag":"li","lines":"133,134"}}],"payload":{"tag":"li","lines":"131,134"}},{"content":"<strong>Prospettiva della Materialit&#xe0;</strong>:","children":[{"content":"<strong>ISSB (IFRS S1/S2) <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Materialit&#xe0; Finanziaria Singola (<em>Outside-In</em>)</strong>: Impatto dei rischi ESG sui flussi di cassa e sul valore dell&apos;impresa per gli investitori;","children":[],"payload":{"tag":"li","lines":"135,136"}},{"content":"<strong>Unione Europea (CSRD / ESRS di EFRAG) <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> Doppia Materialit&#xe0; (<em>Double Materiality</em>)</strong>: Unisce la prospettiva finanziaria (<em>Outside-In</em>) alla <strong>Materialit&#xe0; d&apos;Impatto (<em>Inside-Out</em>)</strong>, cio&#xe8; l&apos;impatto dell&apos;impresa su ambiente, clima e societ&#xe0;.","children":[],"payload":{"tag":"li","lines":"136,138"}}],"payload":{"tag":"li","lines":"134,138"}}],"payload":{"tag":"li","lines":"130,138"}}],"payload":{"tag":"h2","lines":"120,121"}},{"content":"6. Seminario Ferrari: Finance in a Unique Business Model","children":[{"content":"<strong>La Formula di Esclusivit&#xe0; e il Pricing Power</strong>","children":[{"content":"<strong>Regola Aurea di Enzo Ferrari</strong>: <em>&quot;Ferrari will always deliver one car less than the market demands&quot;</em>.","children":[],"payload":{"tag":"li","lines":"140,141"}},{"content":"La crescita non &#xe8; spinta dai volumi di massa, ma dall&apos;<strong>effetto Price/Mix</strong> (personalizzazioni <em>Tailor Made / Atelier</em>, modelli <em>Icona</em> e serie speciali limitate con portafoglio ordini pluriennale).","children":[],"payload":{"tag":"li","lines":"141,142"}}],"payload":{"tag":"li","lines":"139,142"}},{"content":"<strong>Performance Economico-Finanziarie Chiave (2020&#x2013;2025)</strong>","children":[{"content":"<strong>Adjusted EBITDA Margin al 38,8% (2025)</strong>: Incremento di <strong>+580 bps</strong> rispetto al 2020, posizionando Ferrari ai vertici assoluti del settore luxury invece che nell&apos;automotive tradizionale.","children":[],"payload":{"tag":"li","lines":"143,144"}},{"content":"<strong>Free Cash Flow (FCF) Industriale Cumulato di ~&#x20ac;5,1 Miliardi (2020&#x2013;2025)</strong>: Altissima conversione dell&apos;EBITDA in cassa reale (<em>Cash is King</em>), che consente di autofinanziare integralmente i massicci investimenti (<em>CapEx</em> e R&amp;D capitalizzata ex IAS 38) per i nuovi propulsori ibridi/elettrici e la Formula 1, oltre a dividendi e <em>share buyback</em>.","children":[],"payload":{"tag":"li","lines":"144,145"}}],"payload":{"tag":"li","lines":"142,145"}},{"content":"<strong>Il Ruolo Strategico della Finanza: &quot;Finance Makes Trade-Offs Visible&quot;</strong>","children":[{"content":"La direzione Finance rende visibili e misurabili i <strong>4 Trade-Off strategici</strong>:","children":[{"content":"1. <strong>Growth vs Exclusivity</strong> (crescita del business vs difesa della rarit&#xe0; e del valore residuo dell&apos;usato);","children":[],"payload":{"tag":"li","lines":"147,148","listIndex":1}},{"content":"2. <strong>Innovation vs Financial Discipline</strong> (investimenti tecnologici ed elettrificazione vs ritorno sul capitale e disciplina dei costi);","children":[],"payload":{"tag":"li","lines":"148,149","listIndex":2}},{"content":"3. <strong>Global Consistency vs Local Dynamics</strong> (coerenza globale del brand vs ribilanciamento geografico tra EMEA, Americas, Cina e APAC);","children":[],"payload":{"tag":"li","lines":"149,150","listIndex":3}},{"content":"4. <strong>Short-Term Results vs Long-Term Brand Equity</strong> (risultati trimestrali vs tutela secolare del marchio).","children":[],"payload":{"tag":"li","lines":"150,151","listIndex":4}}],"payload":{"tag":"li","lines":"146,151"}}],"payload":{"tag":"li","lines":"145,151"}},{"content":"<strong>Il Processo &quot;From Data to Decision&quot; in 5 Step</strong>","children":[{"content":"<strong>01. Business Question</strong> <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>02. Data &amp; Assumptions</strong> <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>03. Scenarios &amp; Sensitivities</strong> <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>04. Risks &amp; Opportunities</strong> <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>05. Recommendation &amp; Decision</strong>.","children":[],"payload":{"tag":"li","lines":"152,154"}}],"payload":{"tag":"li","lines":"151,154"}}],"payload":{"tag":"h2","lines":"138,139"}},{"content":"7. IAS 16 &#x2013; Immobilizzazioni Materiali (Property, Plant and Equipment)","children":[{"content":"<strong>Definizione e Determinazione del Costo Iniziale (Quesito 06.2)</strong>","children":[{"content":"Beni tangibili ad uso durevole (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">&gt; 1</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.5782em;vertical-align:-0.0391em;\"></span><span class=\"mrel\">&gt;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span></span></span></span> esercizio) impiegati nella produzione, fornitura di beni/servizi o scopi amministrativi.","children":[],"payload":{"tag":"li","lines":"156,157"}},{"content":"<strong>Cosa Entra nel Costo Capitalizzabile</strong>: Prezzo d&apos;acquisto <strong>al netto di sconti commerciali</strong> + dazi/imposte non recuperabili + <strong>costi direttamente attribuibili</strong> per portare il bene nel luogo e nelle condizioni operative necessarie (trasporto, installazione, montaggio, collaudo) + <strong>valore attuale stimato dei costi di smantellamento, rimozione e bonifica del sito</strong> (con contropartita un Fondo ex <strong>IAS 37</strong>).","children":[],"payload":{"tag":"li","lines":"157,158"}},{"content":"<strong>Cosa &#xe8; TASSATIVAMENTE ESCLUSO (Sempre a Conto Economico)</strong>: <strong>Costi di formazione del personale</strong> (assenza di controllo sui dipendenti), spese amministrative e generali, costi di apertura/inaugurazione di un nuovo impianto, costi di lancio promozionale e perdite operative iniziali.","children":[],"payload":{"tag":"li","lines":"158,159"}},{"content":"<strong>Esercizio Risolto (Quesito 06.2)</strong>:","children":[{"content":"<em>Dati</em>: Prezzo &#x20ac;100.000, sconto commerciale &#x20ac;5.000, trasporto &#x20ac;4.000, installazione &#x20ac;6.000, formazione personale &#x20ac;3.000 (escluso!), spese generali &#x20ac;2.000 (escluso!).","children":[],"payload":{"tag":"li","lines":"160,161"}},{"content":"\n<p class=\"katex-block katex-error\" title=\"\\text{Costo Iniziale Capitalizzabile} = (100.000 - 5.000) + 4.000 + 6.000 = \\mathbf{105.000}&#x24;&#x24; &#x20ac;\n\">ParseError: KaTeX parse error: Can&apos;t use function &apos;&#x24;&apos; in math mode at position 93: &#x2026;mathbf{105.000}&#x24;&#x332;&#x24; &#x20ac;\n</p>","children":[],"payload":{"tag":"li","lines":"161,163"}}],"payload":{"tag":"li","lines":"159,163"}},{"content":"<strong>Regola Obbligatoria (Quesito 06.1)</strong>: Se un&apos;immobilizzazione &#xe8; composta da parti significative con vite utili differenti (es. <strong>struttura di un impianto con vita utile 20 anni e motore significativo con vita utile 5 anni</strong>, oppure fusoliera aereo vs motori, o terreno non ammortizzabile vs fabbricato), <strong>ciascun componente significativo deve essere ammortizzato separatamente</strong> lungo la propria specifica vita utile.","children":[],"payload":{"tag":"li","lines":"163,164"}}],"payload":{"tag":"li","lines":"155,164"}},{"content":"<strong>Regole di Ammortamento e Calcolo Pro-Rata Temporis (Quesito 06.3)</strong>","children":[{"content":"<strong>Valore Ammortizzabile</strong>: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Costo&#xa0;Iniziale</mtext><mo>&#x2212;</mo><mtext>Valore&#xa0;Residuo&#xa0;Stimato</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{Costo Iniziale} - \\text{Valore Residuo Stimato}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7778em;vertical-align:-0.0833em;\"></span><span class=\"mord text\"><span class=\"mord\">Costo&#xa0;Iniziale</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord text\"><span class=\"mord\">Valore&#xa0;Residuo&#xa0;Stimato</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"165,166"}},{"content":"<strong>Decorrenza e Continuit&#xe0;</strong>: Inizia quando il bene &#xe8; <strong>disponibile e pronto per l&apos;uso</strong> (anche se non ancora immesso in produzione) e <strong>non cessa mai</strong> se il bene resta temporaneamente inattivo (si ferma solo se classificato <em>Held for Sale</em> ex IFRS 5 o completamente ammortizzato).","children":[],"payload":{"tag":"li","lines":"166,167"}},{"content":"<strong>Esercizio Risolto (Quesito 06.3)</strong>:","children":[{"content":"<em>Dati</em>: Costo &#x20ac;132.000, valore residuo &#x20ac;12.000, vita utile 5 anni, disponibile per l&apos;uso dal <strong>1&#xb0; luglio</strong> (6 mesi su 12).","children":[],"payload":{"tag":"li","lines":"168,169"}},{"content":"Valore ammortizzabile <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>132.000</mn><mo>&#x2212;</mo><mn>12.000</mn><mo>=</mo><mn>120.000</mn></mrow><annotation encoding=\"application/x-tex\">= 132.000 - 12.000 = 120.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">132.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">12.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\" :"li","lines":"170,172"}}],"payload":{"tag":"li","lines":"167,172"}},{"content":"<strong>Cost Model</strong>: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Costo</mtext><mo>&#x2212;</mo><mtext>Ammortamenti&#xa0;cumulati</mtext><mo>&#x2212;</mo><mtext>Impairment&#xa0;cumulati</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{Costo} - \\text{Ammortamenti cumulati} - \\text{Impairment cumulati}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord text\"><span class=\"mord\">Costo</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7778em;vertical-align:-0.0833em;\"></span><span class=\"mord text\"><span class=\"mord\">Ammortamenti&#xa0;cumulati</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord text\"><span class=\"mord\">Impairment&#xa0;cumulati</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"172,173"}},{"content":"<strong>Revaluation Model (Modello della Rideterminazione del Valore)</strong>:","children":[{"content":"Rivalutazione al Fair Value per intere classi omogenee di immobili/impianti:","children":[],"payload":{"tag":"li","lines":"174,175"}},{"content":"<strong>Scrittura Contabile di Rivalutazione (Quesito 06.4)</strong>: Impianto passa da &#x20ac;80.000 a &#x20ac;95.000 senza precedenti svalutazioni:<p class=\"katex-block katex-error\" title=\"\\mathbf{\\text{Dare Impianti } 15.000 \\quad / \\quad \\text{Avere Riserva di Rivalutazione (OCI) } 15.000}&#x24;&#x24; &#x20ac;\n\">ParseError: KaTeX parse error: Can&apos;t use function &apos;&#x24;&apos; in math mode at position 104: &#x2026;(OCI) } 15.000}&#x24;&#x332;&#x24; &#x20ac;\n</p>","children":[],"payload":{"tag":"li","lines":"175,178"}},{"content":"<strong>Divieto Assoluto di Recycling</strong>: Alla dismissione del cespite, la Riserva di Rivalutazione OCI non passa <strong>mai</strong> a Conto Economico, ma viene trasferita direttamente a <em>Utili portati a nuovo</em> (<em>Retained Earnings</em>).","children":[],"payload":{"tag":"li","lines":"178,180"}}],"payload":{"tag":"li","lines":"173,180"}}],"payload":{"tag":"li","lines":"164,180"}}],"payload":{"tag":"h2","lines":"154,155"}},{"content":"8. IFRS 5 &#x2013; Attivit&#xe0; Possedute per la Vendita &amp; Discontinued Operations","children":[{"content":"<strong>Condizioni Tassative per la Classificazione <em>Held for Sale</em> (Quesito 07.1)</strong>","children":[{"content":"Un&apos;attivit&#xe0; non corrente (o gruppo in dismissione) &#xe8; riclassificata come <em>Posseduta per la vendita</em> se il suo valore sar&#xe0; recuperato principalmente tramite una <strong>cessione anzich&#xe9; con l&apos;uso continuativo</strong>, rispettando <strong>2 requisiti cumulativi (Quesito 07.1)</strong>:","children":[{"content":"1. <strong>Disponibilit&#xe0; immediata per la vendita nelle condizioni attuali</strong> (non subordinata a ristrutturazioni rilevanti);","children":[],"payload":{"tag":"li","lines":"183,184","listIndex":1}},{"content":"2. <strong>Vendita altamente probabile entro 12 mesi</strong>: piano approvato dal livello appropriato di management, avvio di un programma attivo di ricerca di un acquirente a un <strong>prezzo congruo e ragionevole</strong> rispetto al Fair Value corrente.","children":[],"payload":{"tag":"li","lines":"184,185","listIndex":2}}],"payload":{"tag":"li","lines":"182,185"}}],"payload":{"tag":"li","lines":"181,185"}},{"content":"<strong>Stop all&apos;Ammortamento e Data Esatta di Interruzione (Quesito 07.2)</strong>","children":[{"content":"<strong>Regola Temporale (Quesito 07.2)</strong>: Se il CdA approva il piano il 15 giugno, tutte le condizioni IFRS 5 sono soddisfatte il <strong>30 settembre</strong> e il rogito di vendita avviene a dicembre, <strong>l&apos;ammortamento cessa esattamente il 30 settembre (data in cui sono soddisfatte tutte le condizioni di classificazione)</strong>.","children":[],"payload":{"tag":"li","lines":"186,187"}},{"content":"<strong>Esposizione nello Stato Patrimoniale</strong>: Il bene viene riclassificato in una voce separata dell&apos;<strong>Attivo Corrente</strong> (<em>&quot;Attivit&#xe0; non correnti possedute per la vendita&quot;</em>), senza riclassificare retroattivamente lo SP comparativo dell&apos;anno precedente (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>&#x2212;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t-1</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6984em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span></span></span></span>).","children":[],"payload":{"tag":"li","lines":"187,188"}}],"payload":{"tag":"li","lines":"185,188"}},{"content":"<strong>Regola di Valutazione al Minore e Calcolo della Perdita (Quesito 07.3)</strong>","children":[{"content":"Alla data di classificazione, il bene &#xe8; valutato al:<p class=\"katex-block\"><span class=\"katex-display\"><span class=\"katex\"><span class=\" .org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>240.000</mn></mrow><annotation encoding=\"application/x-tex\">= 240.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">240.000</span></span></span></span> &#x20ac;; Fair Value <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>230.000</mn></mrow><annotation encoding=\"application/x-tex\">= 230.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">230.000</span></span></span></span> &#x20ac;; Costi di vendita <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>10.000</mn></mrow><annotation encoding=\"application/x-tex\">= 10.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">10.000</span></span></span></span> &#x20ac;.","children":[],"payload":{"tag":"li","lines":"192,193"}},{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Fair&#xa0;Value&#xa0;Nett n></span></span></span></span> &#x20ac;.","children":[],"payload":{"tag":"li","lines":"195,196"}}],"payload":{"tag":"li","lines":"191,196"}}],"payload":{"tag":"li","lines":"188,196"}},{"content":"<strong>Discontinued Operations (Attivit&#xe0; Operative Cessate &#x2013; Quesito 07.4)</strong>","children":[{"content":"<strong>Definizione (Quesito 07.4)</strong>: Componente dell&apos;entit&#xe0; ceduta o classificata <em>held for sale</em> che <strong>rappresenta un importante ramo autonomo di attivit&#xe0; o un&apos;area geografica significativa delle operazioni</strong> (o una controllata acquisita esclusivamente in vista della rivendita). Non &#xe8; <em>discontinued</em> la semplice cessione di un singolo macchinario o veicolo!","children":[],"payload":{"tag":"li","lines":"197,198"}},{"content":"<strong>Presentazione nel Conto Economico</strong>: Tutti gli utili/perdite operativi del ramo e la plus/minusvalenza di cessione sono esposti in <strong>un&apos;unica riga separata al netto delle imposte</strong> in fondo al Conto Economico (con <em>restatement</em> comparativo del P&amp;L dell&apos;anno <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>&#x2212;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t-1</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6984em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span></span></span></span>).","children":[],"payload":{"tag":"li","lines":"198,199"}}],"payload":{"tag":"li","lines":"196,199"}},{"content":"<strong>Revoca del Piano di Vendita (<em>Changes to a Plan of Sale</em>)</strong>","children":[{"content":"Se vengono meno i requisiti IFRS 5, il bene torna nell&apos;Attivo Non Corrente al <strong>minore</strong> tra: 1) il Valore Contabile che avrebbe avuto se non fosse mai stato classificato <em>held for sale</em> (recuperando tutti gli ammortamenti non calcolati nel frattempo) e 2) il <strong>Valore Recuperabile ex IAS 36</strong> alla data della decisione di non vendere.","children":[],"payload":{"tag":"li","lines":"200,202"}}],"payload":{"tag":"li","lines":"199,202"}}],"payload":{"tag":"h2","lines":"180,181"}},{"content":"9. IAS 38 &#x2013; Attivit&#xe0; Immateriali (Intangible Assets)","children":[{"content":"<strong>Definizione e i 3 Requisiti Simultanei di Rilevazione (Quesito 08.1)</strong>","children":[{"content":"<strong>Definizione</strong>: Attivit&#xe0; <strong>non monetaria</strong>, <strong>identificabile</strong>, <strong>priva di consistenza fisica</strong>, <strong>controllata</strong> dall&apos;entit&#xe0; e capace di generare <strong>benefici economici futuri</strong>.","children":[],"payload":{"tag":"li","lines":"204,205"}},{"content":"<strong>1. Requisito dell&apos;Identificabilit&#xe0; (Per distinguerla dall&apos;Avviamento &#x2013; Quesito 08.1)</strong>:","children":[{"content":"&#xc8; soddisfatto se ricorre <strong>ALMENO UNO</strong> di due criteri alternativi:","children":[{"content":"<em>A) Criterio della Separabilit&#xe0;</em>: pu&#xf2; essere scorporata dall&apos;impresa e venduta, trasferita, data in licenza, locata o scambiata; <strong>OPPURE</strong>","children":[],"payload":{"tag":"li","lines":"207,208"}},{"content":"<em>B) Criterio Contrattuale o Legale</em>: nasce da diritti contrattuali o da altri diritti legali, <strong>a prescindere dal fatto che tali diritti siano trasferibili o separabili dall&apos;entit&#xe0;</strong>.","children":[],"payload":{"tag":"li","lines":"208,209"}}],"payload":{"tag":"li","lines":"206,209"}},{"content":"<strong>Caso d&apos;Esame Ufficiale (Quesito 08.1 &amp; Caso PharmaBio)</strong>: Una licenza governativa o d&apos;uso <strong>NON trasferibile a terzi</strong>, ma che attribuisce diritti contrattuali/legali controllati e benefici futuri misurabili, <strong>DEVE essere iscritta all&apos;attivo ex IAS 38</strong>: la non trasferibilit&#xe0; da sola non impedisce l&apos;iscrizione perch&#xe9; l&apos;identificabilit&#xe0; deriva dalla fonte contrattuale/legale!","children":[],"payload":{"tag":"li","lines":"209,210"}}],"payload":{"tag":"li","lines":"205,210"}},{"content":"<strong>2. Requisito del Controllo (Il Caso del Capitale Umano e Formazione)</strong>:","children":[{"content":"Potere di usufruire dei benefici economici futuri della risorsa e di <strong>limitare l&apos;accesso dei terzi</strong> a tali benefici.","children":[],"payload":{"tag":"li","lines":"211,212"}},{"content":"<strong>Perch&#xe9; Formazione e Competenze del Personale (es. &#x20ac;400.000 per un team di ricercatori) vanno SEMPRE a P&amp;L?</strong>: Perch&#xe9; i lavoratori possono dimettersi in qualsiasi momento; l&apos;azienda non ha il controllo giuridico sulle persone.","children":[],"payload":{"tag":"li","lines":"212,213"}}],"payload":{"tag":"li","lines":"210,213"}},{"content":"<strong>3. Probabilit&#xe0; dei Benefici Economici Futuri e Misurabilit&#xe0; Attendibile del Costo</strong>.","children":[],"payload":{"tag":"li","lines":"213,214"}}],"payload":{"tag":"li","lines":"203,214"}},{"content":"<strong>Le 5 Modalit&#xe0; di Acquisizione e Trattamento Contabile</strong>","children":[{"content":"<strong>1. Acquisto Separato</strong>: Iscritto al Costo d&apos;acquisto + oneri accessori direttamente attribuibili (esclusi costi promozionali e spese generali);","children":[],"payload":{"tag":"li","lines":"215,216"}},{"content":"<strong>2. Acquisizione in una Business Combination (IFRS 3)</strong>: Iscritto al <strong>Fair Value alla data di acquisizione</strong>, anche se la societ&#xe0; acquisita non lo aveva contabilizzato nel proprio bilancio perch&#xe9; generato internamente (es. marchio o R&amp;D in corso della target);","children":[],"payload":{"tag":"li","lines":"216,217"}},{"content":"<strong>3. Contributo Pubblico (IAS 20)</strong>: Iscritto al Fair Value o al valore nominale (es. concessioni o diritti di emissione);","children":[],"payload":{"tag":"li","lines":"217,218"}},{"content":"<strong>4. Permuta di Attivit&#xe0;</strong>: Iscritto al Fair Value se lo scambio ha sostanza commerciale;","children":[],"payload":{"tag":"li","lines":"218,219"}},{"content":"<strong>5. Generazione Interna</strong>: Soggetta a severi divieti e alla biforcazione tra Ricerca e Sviluppo.","children":[],"payload":{"tag":"li","lines":"219,220"}}],"payload":{"tag":"li","lines":"214,220"}},{"content":"<strong>Divieti Categorici di Capitalizzazione per Generazione Interna</strong>","children":[{"content":"&#xc8; <strong>TASSATIVAMENTE VIETATO</strong> iscrivere all&apos;attivo (vanno spesati integralmente a P&amp;L quando sostenuti):","children":[{"content":"1. <strong>Avviamento generato internamente (<em>Internally generated goodwill</em>)</strong>;","children":[],"payload":{"tag":"li","lines":"222,223","listIndex":1}},{"content":"2. <strong>Marchi, testate giornalistiche, titoli editoriali, anagrafiche e liste clienti</strong> generati internamente;","children":[],"payload":{"tag":"li","lines":"223,224","listIndex":2}},{"content":"3. <strong>Costi di impianto e di ampliamento / avvio (<em>Start-up costs</em>)</strong>;","children":[],"payload":{"tag":"li","lines":"224,225","listIndex":3}},{"content":"4. <strong>Costi di formazione e addestramento del personale (<em>Training costs</em>)</strong>;","children":[],"payload":{"tag":"li","lines":"225,226","listIndex":4}},{"content":"5. <strong>Costi pubblicitari, promozionali e di marketing</strong> (anche per il lancio di un nuovo prodotto);","children":[],"payload":{"tag":"li","lines":"226,227","listIndex":5}},{"content":"6. <strong>Costi di riorganizzazione o ricollocazione aziendale</strong>.","children":[],"payload":{"tag":"li","lines":"227,228","listIndex":6}}],"payload":{"tag":"li","lines":"221,228"}}],"payload":{"tag":"li","lines":"220,228"}},{"content":"<strong>Ricerca e Sviluppo (R&amp;D): I 6 Criteri Cumulativi PIRATE (Quesiti 08.2 &amp; 08.3)</strong>","children":[{"content":"<strong>Fase di Ricerca (<em>Research</em>)</strong>: Indagine originale pianificata per acquisire nuove conoscenze scientifiche o tecniche <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>SEMPRE A CONTO ECONOMICO (P&amp;L)</strong> nell&apos;esercizio di sostenimento (nessuna certezza di benefici futuri).","children":[],"payload":{"tag":"li","lines":"229,230"}},{"content":"<strong>Fase di Sviluppo (<em>Development</em>)</strong>: Applicazione dei risultati della ricerca a un piano o progetto per produrre materiali, dispositivi o software nuovi/migliorati prima della produzione commerciale. <strong>Obbligo di capitalizzazione all&apos;Attivo SOLO dal giorno in cui sono dimostrati SIMULTANEAMENTE tutti i 6 criteri PIRATE</strong>:","children":[{"content":"<strong>P &#x2013; Probable future economic benefits</strong> (esistenza di un mercato per l&apos;output o utilit&#xe0; interna dimostrata);","children":[],"payload":{"tag":"li","lines":"231,232"}},{"content":"<strong>I &#x2013; Intention to complete</strong> (intenzione formale del management di completare l&apos;attivit&#xe0; immateriale);","children":[],"payload":{"tag":"li","lines":"232,233"}},{"content":"<strong>R &#x2013; Resources available (Quesito 08.3)</strong>: disponibilit&#xe0; di adeguate <strong>risorse tecniche, finanziarie e di altro tipo</strong> per completare lo sviluppo. <strong>Trap d&apos;Esame (Quesito 08.3)</strong>: se la fattibilit&#xe0; tecnica &#xe8; dimostrata ma la societ&#xe0; <strong>non riesce a dimostrare la disponibilit&#xe0; di risorse finanziarie per completare il progetto</strong>, <strong>NON pu&#xf2; capitalizzare i costi di sviluppo</strong> (vanno a P&amp;L!);","children":[],"payload":{"tag":"li","lines":"233,234"}},{"content":"<strong>A &#x2013; Ability to use or sell</strong> (capacit&#xe0; di utilizzare o vendere l&apos;attivit&#xe0; immateriale);","children":[],"payload":{"tag":"li","lines":"234,235"}},{"content":"<strong>T &#x2013; Technical feasibility</strong> (fattibilit&#xe0; tecnica del completamento);","children":[],"payload":{"tag":"li","lines":"235,236"}},{"content":"<strong>E &#x2013; Expenditure reliably measured</strong> (misurazione attendibile dei costi direttamente attribuibili allo sviluppo).","children":[],"payload":{"tag":"li","lines":"236,237"}}],"payload":{"tag":"li","lines":"230,237"}},{"content":"<strong>Esercizio Numerico Risolto (Quesito 08.2 &amp; Caso TechSoft)</strong>:","children":[{"content":"<em>Dati Quesito 08.2</em>: Ricerca <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>30.000</mn></mrow><annotation encoding=\"application/x-tex\">= 30.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">30.000</span></span></span></span> &#x20ac;; Sviluppo prima di soddisfare tutti i 6 criteri <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo>
