{"content":"<strong>Vita Utile Definita vs Indefinita e Valutazione Successiva (Quesito 08.4)</strong>","children":[{"content":"<strong>Attivit&#xe0; a Vita Utile Definita</strong> (es. brevetto a 7 anni): <strong>Ammortamento sistematico</strong> lungo la vita utile (con valore residuo di regola pari a zero) + Impairment test ex IAS 36 solo in presenza di <em>trigger events</em>.","children":[],"payload":{"tag":"li","lines":"243,244"}},{"content":"<strong>Attivit&#xe0; a Vita Utile Indefinita (Quesito 08.4)</strong> (es. licenza radiotelevisiva o concessione rinnovabile senza limiti prevedibili):","children":[{"content":"1. <strong>NESSUN AMMORTAMENTO</strong>;","children":[],"payload":{"tag":"li","lines":"245,246","listIndex":1}},{"content":"2. <strong>Impairment Test obbligatorio almeno una volta all&apos;anno</strong> (e ogni volta che vi siano indicatori);","children":[],"payload":{"tag":"li","lines":"246,247","listIndex":2}},{"content":"3. <strong>Riesame annuale obbligatorio della persistenza della vita utile indefinita</strong> (se diventa definita, si applica come cambio di stima prospettico ex IAS 8).","children":[],"payload":{"tag":"li","lines":"247,248","listIndex":3}}],"payload":{"tag":"li","lines":"244,248"}},{"content":"<strong>Cost Model vs Revaluation Model</strong>: Il <em>Revaluation Model</em> (al Fair Value a Riserva OCI, <strong>senza recycling a P&amp;L</strong>) &#xe8; consentito <strong>ESCLUSIVAMENTE se esiste un MERCATO ATTIVO</strong> ex IFRS 13 (es. quote di emissione <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mtext>CO</mtext><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\text{CO}_2</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord\">CO</span></span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3011em;\"><span style=\"top:-2.55em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span><span class=\"vlist-s\">&#x200b;</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span> negoziate sull&apos;EEX; &#xe8; <strong>sempre vietato</strong> per marchi, brevetti e diritti d&apos;autore perch&#xe9; beni unici privi di mercato attivo, anche in presenza di perizia giurata!).","children":[],"payload":{"tag":"li","lines":"248,250"}}],"payload":{"tag":"li","lines":"242,250"}}],"payload":{"tag":"h2","lines":"202,203"}},{"content":"10. IFRS 16 &#x2013; Leasing","children":[{"content":"<strong>La Riforma: Dal Doppio Modello IAS 17 al <em>Single Lessee Model</em> IFRS 16</strong>","children":[{"content":"Con lo IAS 17 i locatari classificavano la maggioranza dei contratti come <em>leasing operativi</em>, lasciando aerei, navi, immobili e flotte aziendali <strong>fuori bilancio (<em>off-balance sheet</em>)</strong> e occultando il reale indebitamento finanziario.","children":[],"payload":{"tag":"li","lines":"252,253"}},{"content":"Con l&apos;<strong>IFRS 16</strong> (per il locatario) cade ogni distinzione tra leasing operativo e finanziario: <strong>tutti i contratti di leasing comportano l&apos;iscrizione nello Stato Patrimoniale</strong> di un&apos;<strong>Attivit&#xe0; per Diritto d&apos;Uso (<em>Right-of-Use Asset &#x2013; ROU</em>)</strong> e di una <strong>Passivit&#xe0; Finanziaria per Leasing (<em>Lease Liability</em>)</strong>.","children":[],"payload":{"tag":"li","lines":"253,254"}}],"payload":{"tag":"li","lines":"251,254"}},{"content":"<strong>Definizione di Leasing, Test del Controllo e Diritto di Sostituzione (Quesito 09.1)</strong>","children":[{"content":"Un contratto &#xe8; (o contiene) un leasing se conferisce il <strong>diritto di controllare l&apos;uso di un bene identificato per un periodo di tempo in cambio di un corrispettivo</strong>.","children":[],"payload":{"tag":"li","lines":"255,256"}},{"content":"<strong>Le 2 Condizioni Cumulativi del Controllo (Quesito 09.1)</strong>:","children":[{"content":"1. <strong>Benefit Element</strong>: il cliente ha il diritto di <strong>ottenere sostanzialmente tutti i benefici economici</strong> derivanti dall&apos;utilizzo del bene identificato lungo l&apos;intero periodo di utilizzo;","children":[],"payload":{"tag":"li","lines":"257,258","listIndex":1}},{"content":"2. <strong>Power Element</strong>: il cliente ha il diritto di <strong>dirigere l&apos;utilizzo del bene</strong> (decidere <em>come</em>, <em>quando</em> e <em>per quale scopo</em> il bene viene impiegato).","children":[],"payload":{"tag":"li","lines":"258,259","listIndex":2}}],"payload":{"tag":"li","lines":"256,259"}},{"content":"<strong>Diritto Sostanziale di Sostituzione (<em>Substantive Substitution Right</em> &#x2013; Caso Flotta Van)</strong>: Se il fornitore ha la capacit&#xe0; pratica di sostituire il bene durante il contratto e <strong>ottiene un beneficio economico dalla sostituzione</strong>, il bene non &#xe8; identificato <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2192;</mo></mrow><annotation encoding=\"application/x-tex\">\\rightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">&#x2192;</span></span></span></span> <strong>NON &#xe8; un leasing ma una prestazione di servizi</strong> (canoni a P&amp;L).","children":[],"payload":{"tag":"li","lines":"259,260"}},{"content":"<strong>Separazione delle Componenti</strong>: I servizi accessori (es. manutenzione, pulizia, assicurazione) vanno scorporati dalla quota leasing e imputati a P&amp;L come costi operativi.","children":[],"payload":{"tag":"li","lines":"260,261"}}],"payload":{"tag":"li","lines":"254,261"}},{"content":"<strong>Rilevazione e Misurazione Iniziale alla Data di Decorrenza (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6151em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">0</span></span></span></span>) (Quesito 09.2)</strong>","children":[{"content":"<strong>1. Passivit&#xe0; per Leasing (<em>Lease Liability</em>) iniziale</strong>:","children":[{"content":"&#xc8; pari al <strong>Valore Attuale dei pagamenti dovuti per il leasing non ancora versati</strong> alla data di decorrenza (includendo canoni fissi, canoni variabili legati a un indice/tasso, prezzo di esercizio dell&apos;opzione di acquisto se ragionevolmente certa e penali di risoluzione), attualizzati al <strong>tasso di interesse implicito del leasing</strong> (o al <strong>tasso di finanziamento marginale del locatario &#x2013; IBR</strong>).","children":[],"payload":{"tag":"li","lines":"263,264"}},{"content":"<strong>Trap d&apos;Esame</strong>: gli anticipi o canoni gi&#xe0; pagati alla data di decorrenza (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotati e il costo operativo dei canoni di affitto, sostituito da ammortamenti (sotto l&apos;EBITDA) e interessi passivi (nella gestione finanziaria).","children":[],"payload":{"tag":"li","lines":"282,283"}},{"content":"<strong>Effetto Front-Loading sull&apos;Utile Netto</strong>: Poich&#xe9; l&apos;ammortamento del ROU &#xe8; costante mentre gli interessi passivi sono calcolati sul debito residuo (massimo nei primi anni e decrescente nel tempo), <strong>nei primi anni del contratto il costo totale a P&amp;L (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>Ammortamento</mtext><mo>+</mo><mtext>Interessi</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{Ammortamento} + \\text{Interessi}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord text\"><span class=\"mord\">Ammortamento</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord text\"><span class=\"mord\">Interessi</span></span></span></span></span>) &#xe8; superiore al vecchio canone costante</strong>, riducendo l&apos;utile netto iniziale per poi invertirsi negli ultimi anni.","children":[],"payload":{"tag":"li","lines":"283,284"}},{"content":"<strong>Rendiconto Finanziario (IAS 7)</strong>: Stipula a <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6151em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">0</span></span></span></span> esclusa (operazione non monetaria); il pagamento della <strong>quota capitale del canone va nell&apos;Attivit&#xe0; di Finanziamento (<em>Financing Outflow</em>)</strong>, migliorando il Flusso di Cassa Operativo.","children":[],"payload":{"tag":"li","lines":"284,285"}}],"payload":{"tag":"li","lines":"273,285"}},{"content":"<strong>Le 2 Esenzioni per il Locatario (Quesito 09.4) e la Contabilit&#xe0; del Locatore</strong>","children":[{"content":"<strong>Esenzioni Locatario (Quesito 09.4)</strong>: 1) <strong>Leasing a breve termine</strong> (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2264;</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">\\le 12</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7719em;vertical-align:-0.136em;\"></span><span class=\"mrel\">&#x2264;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">12</span></span></span></span> mesi senza opzione di acquisto); 2) <strong>Beni di modico valore</strong> (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&#x2264;</mo><mi mathvariant=\"normal\">&#x24;</mi><mn>5.000</mn></mrow><annotation encoding=\"application/x-tex\">\\le \\&#x24;5.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7719em;vertical-align:-0.136em;\"></span><span class=\"mrel\">&#x2264;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8056em;vertical-align:-0.0556em;\"></span><span class=\"mord\">&#x24;5.000</span></span></span></span> da nuovi, es. PC, tablet, stampanti). <strong>&#xc8; una facolt&#xe0; (<em>accounting policy choice</em>), NON un obbligo</strong>: se esercitata, il locatario non iscrive ROU e debito ma rileva i canoni come costo operativo lineare a P&amp;L.","children":[],"payload":{"tag":"li","lines":"286,287"}},{"content":"<strong>Locatore (<em>Lessor</em>)</strong>: Mantiene la distinzione tra <strong>Leasing Operativo</strong> (mantiene il bene all&apos;attivo e rileva i canoni come ricavi) e <strong>Leasing Finanziario</strong> (elimina il bene e iscrive un credito finanziario <em>Lease Receivable</em> pari all&apos;investimento netto nel leasing).","children":[],"payload":{"tag":"li","lines":"287,289"}}],"payload":{"tag":"li","lines":"285,289"}}],"payload":{"tag":"h2","lines":"250,251"}},{"content":"11. Criptovalute &amp; Crypto-Assets (IFRIC 2019 &amp; Presentazione d&apos;Aula)","children":[{"content":"<strong>Origini, Definizione Istituzionale (BCE vs EFRAG) e i 3 Problemi di Fondo</strong>","children":[{"content":"<strong>Origini (Slide d&apos;Aula)</strong>: Introdotte con la tecnologia Blockchain per eliminare l&apos;intermediazione di terzi nei pagamenti digitali; <strong>Bitcoin</strong> concepito a ottobre 2008 da <em>Satoshi Nakamoto</em> e lanciato a gennaio 2009 (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&gt;</mo><mn>899</mn><mtext>&#xa0;milioni</mtext></mrow><annotation encoding=\"application/x-tex\">&gt; 899\\text{ milioni}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.5782em;vertical-align:-0.0391em;\"></span><span class=\"mrel\">&gt;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord\">899</span><span class=\"mord text\"><span class=\"mord\">&#xa0;milioni</span></span></span></span></span> di transazioni).","children":[],"payload":{"tag":"li","lines":"291,292"}},{"content":"<strong>I 3 Problemi Contabili Evidenziati dal Docente</strong>: 1) <strong>Nomenclatura</strong> (assenza di tassonomia contabile univoca); 2) <strong>Incertezza Giuridica</strong> (qualificazioni disomogenee tra Paesi); 3) <strong>Accountability &amp; Audit</strong> (custodia delle chiavi crittografiche private, cyber-risk e valutazione).","children":[],"payload":{"tag":"li","lines":"292,293"}},{"content":"<strong>Le 2 Definizioni Ufficiali delle Slide</strong>:","children":[{"content":"<strong>BCE (<em>ECB Crypto-Assets Task Force</em>)</strong>: <em>&quot;A new type of asset recorded in digital form and enabled by the use of cryptography that <strong>is not and does not represent a financial claim on, or a liability of, any identifiable entity</strong>&quot;</em> (non rappresenta un credito finanziario n&#xe9; una passivit&#xe0; verso alcuna entit&#xe0; identificabile);","children":[],"payload":{"tag":"li","lines":"294,295"}},{"content":"<strong>EFRAG</strong>: <em>&quot;A digital representation of value or contractual rights created, transferred and stored on some type of distributed ledger technology (DLT) network (e.g. Blockchain) and authenticated through cryptography&quot;</em>.","children":[],"payload":{"tag":"li","lines":"295,296"}}],"payload":{"tag":"li","lines":"293,296"}}],"payload":{"tag":"li","lines":"290,296"}},{"content":"<strong>Cosa NON Sono le Criptovalute secondo l&apos;IFRIC (Quesito 10.2)</strong>","children":[{"content":"<strong>1. NON sono Moneta / Cassa</strong>: non hanno corso legale forzoso e non sono emesse da banche centrali;","children":[],"payload":{"tag":"li","lines":"297,298"}},{"content":"<strong>2. NON sono Disponibilit&#xe0; Liquide Equivalenti (<em>Cash Equivalents</em> ex IAS 7 &#x2013; Quesito 10.2)</strong>:","children":[{"content":"<em>Obiezione Fondamentale (Quesito 10.2)</em>: anche se negoziabili 24/7 su una piattaforma exchange, <strong>la negoziabilit&#xe0; non garantisce un importo monetario stabile n&#xe9; equivale a un diritto di credito verso una banca</strong>, e l&apos;altissima volatilit&#xe0; di prezzo viola il requisito IAS 7 di <em>&quot;rischio trascurabile di variazione del valore&quot;</em>;","children":[],"payload":{"tag":"li","lines":"299,300"}}],"payload":{"tag":"li","lines":"298,300"}},{"content":"<strong>3. NON sono Attivit&#xe0; Finanziarie ordinarie (IAS 32 / IFRS 9)</strong>: non attribuiscono alcun diritto contrattuale a ricevere disponibilit&#xe0; liquide o altre attivit&#xe0; finanziarie da un emittente obbligato.","children":[],"payload":{"tag":"li","lines":"300,301"}}],"payload":{"tag":"li","lines":"296,301"}},{"content":"<strong>L&apos;Albero Decisionale IFRS: Scopo della Detenzione e Business Model (Quesito 10.1)</strong>","children":[{"content":"<strong>Regola Cardine (Quesito 10.1)</strong>: Tra un&apos;impresa che acquista Bitcoin per rivenderli abitualmente ai clienti e una che li conserva come investimento, l&apos;informazione decisiva &#xe8; <strong>lo scopo della detenzione e il modello di attivit&#xe0; (<em>business model</em>) di ciascuna impresa</strong>:","children":[],"payload":{"tag":"li","lines":"302,303"}},{"content":"<strong>Ramo 1: IAS 38 &#x2013; Attivit&#xe0; Immateriali (<em>Intangible Assets</em>)</strong>:","children":[{"content":"Si applica quando le criptovalute sono detenute per <strong>investimento a medio-lungo termine o riserva di valore</strong> (caso standard delle imprese non finanziarie).","children":[],"payload":{"tag":"li","lines":"304,305"}},{"content":"Sono attivit&#xe0; immateriali a <strong>vita utile indefinita</strong>: <strong>nessun ammortamento</strong> e <strong>Impairment Test annuale obbligatorio ex IAS 36</strong> (se il valore recuperabile &#xe8; inferiore al costo, si rileva subito la svalutazione a P&amp;L).","children":[],"payload":{"tag":"li","lines":"305,306"}},{"content":"Valutazione successiva: <strong>Cost Model</strong> (costo storico meno svalutazioni) oppure <strong>Revaluation Model</strong> (solo se esiste un mercato attivo ex IFRS 13, con incrementi di Fair Value sopra il costo imputati a <strong>Riserva OCI</strong> a Patrimonio Netto e mai a P&amp;L).","children":[],"payload":{"tag":"li","lines":"306,307"}}],"payload":{"tag":"li","lines":"303,307"}},{"content":"<strong>Ramo 2: IAS 2 &#x2013; Rimanenze (<em>Inventories</em>)</strong>:","children":[{"content":"Si applica quando le criptovalute sono <strong>detenute per la vendita nel normale svolgimento dell&apos;attivit&#xe0; caratteristica</strong>:","children":[{"content":"<em>Imprese commerciali ordinarie</em>: valutate al <strong>minore tra il costo e il valore netto di realizzo (NRV)</strong>, con svalutazioni a P&amp;L;","children":[],"payload":{"tag":"li","lines":"309,310"}},{"content":"<em>Intermediari / Broker-Dealer di Criptovalute</em>: valutate al <strong>Fair Value al netto dei costi di vendita (FVTPL)</strong>, con <strong>tutte le oscillazioni di prezzo (utili e perdite) imputate direttamente a Conto Economico (P&amp;L)</strong>.","children":[],"payload":{"tag":"li","lines":"310,311"}}],"payload":{"tag":"li","lines":"308,311"}}],"payload":{"tag":"li","lines":"307,311"}},{"content":"<strong>Ramo 3: IFRS 9 &#x2013; Strumenti Finanziari (<em>Security Tokens / Asset-Backed Tokens</em>)</strong>:","children":[{"content":"Si applica solo ai token digitali che conferiscono un effettivo <strong>diritto contrattuale a flussi finanziari</strong> verso un emittente: se superano lo <strong>SPPI Test</strong> (<em>Solely Payments of Principal and Interest</em>) si valutano al <strong>Costo Ammortizzato</strong> (o FVTOCI); se detenuti per <em>trading</em> speculativo o non superano lo SPPI test, si valutano al <strong>Fair Value Through Profit or Loss (FVTPL)</strong>.","children":[],"payload":{"tag":"li","lines":"312,313"}}],"payload":{"tag":"li","lines":"311,313"}}],"payload":{"tag":"li","lines":"301,313"}},{"content":"<strong>Aumento di Prezzo (Quesito 10.3) e Il Confronto Internazionale FASB (USA) vs IASB (IFRS)</strong>","children":[{"content":"<strong>Quando il Prezzo di Bitcoin Sale (Quesito 10.3)</strong>: Prima di concludere che un rialzo di prezzo sia un utile in bilancio, <strong>occorre conoscere il criterio contabile applicabile e le condizioni per rilevare la variazione</strong>:","children":[{"content":"Sotto <strong>IASB (IFRS &#x2013; IAS 38 Cost Model)</strong>: il rialzo <strong>non si rileva affatto</strong>;","children":[],"payload":{"tag":"li","lines":"315,316"}},{"content":"Sotto <strong>IASB (IFRS &#x2013; IAS 38 Revaluation Model)</strong>: il rialzo va a <strong>Riserva OCI (Patrimonio Netto)</strong> e non a P&amp;L;","children":[],"payload":{"tag":"li","lines":"316,317"}},{"content":"Sotto <strong>IASB (IAS 2 Broker-Dealer)</strong>: il rialzo va a <strong>P&amp;L</strong>.","children":[],"payload":{"tag":"li","lines":"317,318"}}],"payload":{"tag":"li","lines":"314,318"}},{"content":"<strong>La Riforma Americana FASB (ASU Subtopic 350-60 del 2023 &#x2013; Slide d&apos;Aula)</strong>:","children":[{"content":"A differenza dello IASB, il <strong>FASB (US GAAP)</strong> ha introdotto l&apos;obbligo di valutare i crypto-assets al <strong>Fair Value con variazioni imputate direttamente a Conto Economico (<em>Fair Value Through Net Income &#x2013; FVTPL</em>)</strong>, anche per le societ&#xe0; industriali che li detengono come investimento!","children":[],"payload":{"tag":"li","lines":"319,320"}},{"content":"Nello Stato Patrimoniale FASB devono essere esposti in una riga separata denominata <strong>&quot;Digital Assets&quot;</strong>.","chi <script>
  let currentModuleIdx = -1;

  function cloneTreeWithFold(node, maxDepth, currentDepth = 0) {
    const copy = {
      content: node.content,
      children: (node.children || []).map(ch => cloneTreeWithFold(ch, maxDepth, currentDepth + 1)),
      payload: Object.assign({}, node.payload || {})
    };
    if (copy.children.length > 0 && currentDepth >= maxDepth) {
      copy.payload.fold = 1;
    } else {
      copy.payload.fold = 0;
    }
    return copy;
  }

  function getActiveSubtree() {
    if (!window.__FULL_ROOT) return null;
    if (currentModuleIdx === -1) {
      return JSON.parse(JSON.stringify(window.__FULL_ROOT));
    }
    const ch = window.__FULL_ROOT.children && window.__FULL_ROOT.children[currentModuleIdx];
    return ch ? JSON.parse(JSON.stringify(ch)) : JSON.parse(JSON.stringify(window.__FULL_ROOT));
  }

  function mmSelectModule(idx, btnEl) {
    currentModuleIdx = idx;
    if (btnEl) {
      document.querySelectorAll('.pci-mm-pill').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
    } else {
      const pills = document.querySelectorAll('.pci-mm-pill');
      pills.forEach((b, i) => b.classList.toggle('active', i === idx + 1));
    }
    const base = getActiveSubtree();
    if (!base || !window.mm) return;
    // Se si seleziona un singolo modulo, espandi fino al livello 3 per mostrarne subito i dettagli
    const depth = idx === -1 ? 2 : 3;
    const folded = cloneTreeWithFold(base, depth);
    window.mm.setData(folded);
    setTimeout(() => window.mm.fit(), 120);
  }

  function mmSetFoldLevel(maxDepth) {
    const base = getActiveSubtree();
    if (!base || !window.mm) return;
    const folded = cloneTreeWithFold(base, maxDepth);
    window.mm.setData(folded);
    setTimeout(() => window.mm.fit(), 120);
  }

  function mmFit() {
    if (window.mm) window.mm.fit();
  }

  // Ascolta comandi postMessage dal sito principale PCI Study Hub
  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.type === 'PCI_MM_SELECT_MODULE') {
      mmSelectModule(data.moduleIndex, null);
    } else if (data.type === 'PCI_MM_FOLD_LEVEL') {
      mmSetFoldLevel(data.level);
    } else if (data.type === 'PCI_MM_FIT') {
      mmFit();
    }
  });

  // All'avvio imposta dark mode per contrasto ottimale
  window.addEventListener('load', () => {
    document.documentElement.classList.add('markmap-dark');
  });
</script>
